name: Validate forest port
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bevy-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Linux Rust and graphics dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Bake benchmark provenance
        run: python3 benchmark/build.py
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          BEVY_FIXED_RESOLUTION=0 cargo check --locked --lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .deps
            assets/generated
          key: forest-assets-${{ hashFiles('vendor/**', 'scripts/prepare_scene.py', 'scripts/export_geometry.cpp', 'scripts/environment.py', 'scripts/requirements.txt', 'assets/sources.json') }}
      - name: Verify source geometry and textures
        run: |
          pip install -r scripts/requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          if [[ ! -f assets/generated/specular.dds ]]; then python3 scripts/prepare_scene.py; fi
          python3 scripts/check_assets.py
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
